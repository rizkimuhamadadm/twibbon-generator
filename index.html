<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Generator - Created by Adam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

    <div class="fixed inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/15 blur-[120px] rounded-full pointer-events-none"></div>

    <header class="relative z-10 w-full border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md px-6 py-4">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-sm">
                    TG
                </div>
                <span class="font-bold tracking-tight text-slate-100 text-sm sm:text-base">Twibbon Generator</span>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Open Source
                </span>
                <a href="https://github.com/username/twibbon-generator" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-slate-400 hover:text-white transition flex items-center gap-2 bg-slate-900 border border-slate-800 hover:border-slate-700 px-3 py-1.5 rounded-lg">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
                    </svg>
                    <span>GitHub</span>
                </a>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4 sm:p-6 my-6">
        <div class="bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 shadow-2xl rounded-3xl p-6 sm:p-8 w-full max-w-lg text-center relative overflow-hidden">
            
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-4">
                Open Source Web App
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
                Twibbon Generator
            </h1>
            <p class="text-xs sm:text-sm font-medium text-slate-400 mb-8">
                Created by <span class="text-slate-200 font-semibold">Adam</span>
            </p>

            <div class="flex justify-center mb-6">
                <div id="captureArea" class="twibbon-container rounded-2xl shadow-2xl border border-slate-800/80 cursor-grab active:cursor-grabbing relative">
                    
                    <img id="userPhoto" src="" alt="Foto Pengguna" class="user-photo hidden">
                    
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-6 z-0 bg-slate-950/60">
                        <div class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3">
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                            </svg>
                        </div>
                        <span class="text-xs font-medium text-slate-400">Unggah foto kamu di bawah ini</span>
                    </div>

                    <img src="assets/img/bingkai.png" alt="Bingkai Twibbon" class="twibbon-overlay">
                </div>
            </div>

            <div id="controls" class="hidden bg-slate-950/70 p-4 rounded-2xl border border-slate-800/80 mb-6 text-left">
                <div class="flex items-center justify-between text-xs mb-3">
                    <span class="font-medium text-slate-400">Skala Foto</span>
                    <span id="zoomValue" class="text-indigo-400 font-semibold font-mono">100%</span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button id="zoomOutBtn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 w-10 h-10 rounded-xl font-semibold transition flex items-center justify-center text-base shrink-0">
                        -
                    </button>
                    <input type="range" id="zoomRange" min="0.3" max="3" step="0.05" value="1" class="w-full accent-indigo-500 cursor-pointer">
                    <button id="zoomInBtn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 w-10 h-10 rounded-xl font-semibold transition flex items-center justify-center text-base shrink-0">
                        +
                    </button>
                    <button id="resetBtn" class="bg-slate-900 hover:bg-rose-950/30 border border-slate-800 hover:border-rose-900/50 text-slate-300 hover:text-rose-400 px-3.5 h-10 rounded-xl text-xs font-medium transition shrink-0">
                        Reset
                    </button>
                </div>
                <p class="text-[11px] text-slate-500 mt-3 font-normal">Petunjuk : Klik dan tahan foto di atas untuk menggeser posisi.</p>
            </div>

            <div class="space-y-3">
                <label class="block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl cursor-pointer transition shadow-lg shadow-indigo-600/25 text-center text-sm border border-indigo-500/30">
                    Pilih Foto
                    <input type="file" id="upload" accept="image/*" class="hidden">
                </label>

                <button id="downloadBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-lg shadow-emerald-600/25 hidden text-sm border border-emerald-500/30">
                    Unduh Hasil Twibbon
                </button>
            </div>
        </div>
    </main>

    <footer class="relative z-10 w-full border-t border-slate-800/60 bg-slate-950/40 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Twibbon Generator &bull; Released under MIT License</p>
        <p class="mt-1">Designed & Developed by <span class="text-slate-400 font-medium">Adam</span></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
